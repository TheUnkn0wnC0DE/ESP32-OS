<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Startseite</title>
<style>
body { margin: 0; background: #eef2f7; font-family: sans-serif; color: #223; }
.kopf { background: #3a6ea5; color: white; padding: 18px 0 14px 0; text-align: center; }
.kopf h1 { margin: 0; font-size: 2em; }
form { margin: 40px auto 0 auto; width: 86%; text-align: center; }
input.feld { width: 96%; font-size: 2em; padding: 10px; border: 3px solid #3a6ea5; background: white; }
input.knopf { margin-top: 18px; font-size: 1.6em; padding: 8px 40px; background: #3a6ea5; color: white; border: 2px solid #2a5080; }
p.hinweis { text-align: center; color: #556; margin-top: 18px; }
ul.links { margin: 30px auto; width: 86%; padding: 0; text-align: center; }
ul.links li { display: inline; margin: 0 14px; font-size: 1.3em; }
</style>
</head>
<body>
<div class="kopf"><h1>ESP32-OS Browser</h1></div>
<form action="https://html.duckduckgo.com/html/" method="get">
<input class="feld" type="text" name="q" placeholder="Suchen oder Adresse eingeben">
<br>
<input class="knopf" type="submit" value="Suchen">
</form>
<p class="hinweis">Suche mit DuckDuckGo. Wörter in der Adressleiste suchen ebenfalls.</p>
<ul class="links">
<li><a href="https://de.wikipedia.org/">Wikipedia</a></li>
<li><a href="https://lite.duckduckgo.com/lite/">DuckDuckGo Lite</a></li>
<li><a href="https://www.srf.ch/">SRF</a></li>
</ul>
</body>
</html>
