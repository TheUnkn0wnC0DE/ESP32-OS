[package]
name = "netsurf"
description = "NetSurf-Browser (B1): Upstream 3.11 mit Framebuffer-Frontend auf dem Kern"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-2.0-only"

[dependencies]
# B8: Bilddekoder des Systems (JPEG inkl. progressiv, PNG) für c/bild.c
kolibri = { path = "../kolibri" }

# 32 Bit (i686, Board): NetSurf als ESP32-OS-Programm „browser“
[target.'cfg(target_pointer_width = "32")'.dependencies]
kern = { path = "../kern" }

[dev-dependencies]
spatz = { path = "../../spatz", default-features = false }

[build-dependencies]
cc = "1"
