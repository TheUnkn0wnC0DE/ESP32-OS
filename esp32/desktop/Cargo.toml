[package]
name = "desktop"
description = "ESP32-OS: Desktop (Compositor an der Anzeige-Pipeline, Touch-Eingabe)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
kern = { path = "../kern" }
kolibri = { path = "../kolibri" }
konsole = { path = "../konsole" }
pudding-core = { path = "../game" }

# 32 Bit (i686, Board): Browser (NetSurf, B1)
[target.'cfg(target_pointer_width = "32")'.dependencies]
netsurf = { path = "../netsurf" }

[dev-dependencies]
spatz = { path = "../../spatz", default-features = false }
