[workspace]
resolver = "3"
# Software-3D-Engine „spatz“ (von den Spielen in esp32/ genutzt). ESP32-OS
# selbst ist ein eigener Workspace in esp32/ (Firmware: esp32/firmware).
members = ["spatz"]
exclude = ["esp32"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

# Release: maximale Optimierung, kleine Binärdatei, kein Unwinding-Overhead.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
incremental = false
strip = true

# Debug-Builds mit Optimierung (Software-Rendering ist sonst zäh).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Tests mit Optimierung, damit Render-/Physik-Tests schnell laufen.
[profile.test]
opt-level = 2
