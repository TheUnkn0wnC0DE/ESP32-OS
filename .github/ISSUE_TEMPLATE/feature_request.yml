name: Feature request
description: Suggest a new feature, program or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the *Limitations* in the README first; some features are already planned (for example standby, battery gauge and camera for 1.1).
        You can write in English or German.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you want to do and why it is not possible or hard today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How could it work on the device?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you thought about.
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to help implement this.
